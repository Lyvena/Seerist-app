<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Transparent background; the seer lens carries the brand color -->

  <!-- Seer lens: ring + iris -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="url(#lens)" stroke-width="34"/>
  <circle cx="256" cy="256" r="46" fill="url(#lens)"/>

  <!-- Orbital scan arc with satellite dot (foresight / radar) -->
  <g transform="rotate(-24 256 256)">
    <path d="M 74 256 A 182 182 0 0 1 438 256"
          fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="438" cy="256" r="26" fill="url(#lens)"/>
  </g>
</svg>
