<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="196" fill="#ffffff" opacity="0.06"/>

  <!-- Seer lens: ring + iris -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#ffffff" stroke-width="34"/>
  <circle cx="256" cy="256" r="46" fill="#ffffff"/>

  <!-- Orbital scan arc with satellite dot (foresight / radar) -->
  <g transform="rotate(-24 256 256)">
    <path d="M 74 256 A 182 182 0 0 1 438 256"
          fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="438" cy="256" r="26" fill="#ffffff"/>
  </g>
</svg>
